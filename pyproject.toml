[project]
name = "lithium-systemgroup"
version = "0.2.0"
description = "SystemGroup CRM client and BoM / customer-order parsers for Python projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "S-Diaco", email = "dyaco8464@yahoo.com" }
]
dependencies = [
    "requests>=2.32.0",
]
keywords = ["systemgroup", "crm", "bom", "orders", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/s-diaco/lithium-systemgroup"
Repository = "https://github.com/s-diaco/lithium-systemgroup"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lithium_systemgroup"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
